name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: Host (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: host/go.mod
      - name: Resolve dependencies
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Build host
        run: go build ./cmd/storplay-host

  web:
    name: Web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build

  windows-package:
    name: Windows development package
    runs-on: ubuntu-latest
    needs: [host, web]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: host/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package.json

      - name: Build web client
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build Windows host
        working-directory: host
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          go mod tidy
          mkdir -p ../package
          go build -o ../package/storplay-host.exe ./cmd/storplay-host

      - name: Assemble package
        run: |
          mkdir -p package/web
          cp -R web/dist/. package/web/
          cp packaging/windows/Start-StorPlay.bat package/Start-StorPlay.bat
          cp packaging/windows/README.txt package/README.txt

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: storplay-windows-amd64
          path: package/
          if-no-files-found: error
          retention-days: 14
